<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recuperar dados</title>
<meta name="theme-color" content="#14181D">
<style>
  :root{--bg:#14181D;--panel:#1B2129;--line:#2A313B;--text:#EDEFF2;--muted:#8B93A0;--amber:#E8A93B;--teal:#3D8C82;--rose:#C4634F;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 48px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:24px;font-weight:650;margin:0 0 8px;}
  p{font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 14px;}
  .origin{font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 20px;word-break:break-all;}
  .list{border-top:1px solid var(--line);margin:0 0 20px;}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 4px 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--teal);font-size:14px;}
  .row span:first-child{word-break:break-all;}
  .row span:last-child{color:var(--muted);flex:0 0 auto;}
  .empty{border-left-color:var(--rose);color:var(--muted);}
  button{display:block;width:100%;padding:15px;margin:0 0 10px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
  .primary{background:var(--amber);color:#14181D;}
  .secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);}
  button:disabled{opacity:.4;}
  button:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
  .msg{font-size:14px;color:var(--teal);min-height:20px;margin:6px 0 0;}
  .extra{font-size:13px;color:var(--muted);margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Recuperar dados</h1>
  <p>Esta página lê os dados que os apps salvaram neste celular no endereço antigo e gera um arquivo de backup.</p>
  <div class="origin" id="origin"></div>

  <div class="list" id="list"></div>

  <button class="primary" id="btnDownload">Baixar backup</button>
  <button class="secondary" id="btnCopy">Copiar backup</button>
  <div class="msg" id="msg"></div>
  <div class="extra" id="extra"></div>
</div>

<script>
  const dados = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      dados[k] = localStorage.getItem(k);
    }
  } catch (e) {}

  document.getElementById('origin').textContent = location.origin;

  const list = document.getElementById('list');
  const chaves = Object.keys(dados).sort();
  if (chaves.length === 0) {
    list.innerHTML = '<div class="row empty"><span>Nenhum dado encontrado neste navegador.</span></div>';
    document.getElementById('btnDownload').disabled = true;
    document.getElementById('btnCopy').disabled = true;
  } else {
    chaves.forEach(k => {
      const row = document.createElement('div');
      row.className = 'row';
      const kb = (dados[k].length / 1024).toFixed(1);
      row.innerHTML = '<span></span><span>' + kb + ' KB</span>';
      row.firstChild.textContent = k;
      list.appendChild(row);
    });
  }

  const backup = {
    tipo: 'backup-localstorage',
    origem: location.origin,
    gerado_em: new Date().toISOString(),
    dados: dados
  };
  const texto = JSON.stringify(backup);
  const msg = document.getElementById('msg');

  document.getElementById('btnDownload').onclick = () => {
    const blob = new Blob([texto], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-apps-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    msg.textContent = 'Backup baixado. Confira na pasta Downloads.';
  };

  document.getElementById('btnCopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(texto);
      msg.textContent = 'Backup copiado. Cole em um lugar seguro, como uma nota ou WhatsApp para você mesmo.';
    } catch (e) {
      msg.textContent = 'Não foi possível copiar. Use o botão Baixar backup.';
    }
  };

  if (indexedDB && indexedDB.databases) {
    indexedDB.databases().then(dbs => {
      if (dbs && dbs.length) {
        document.getElementById('extra').textContent =
          'Também existem bancos IndexedDB: ' + dbs.map(d => d.name).join(', ') + '. Se algum dado não aparecer na lista acima, avise.';
      }
    }).catch(() => {});
  }
</script>
</body>
</html>
